spring:
  apllication:
    name: user-service
  datasource:
    url: jdbc:mariadb://localhost:3306/users
    username: root
    password:
  jpa:
    generate-ddl: true
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update

server:
  port: 8082

#task-service:
#  ribbon:
#    listOfServers:  http://localhost:8083/,http://localhost:8085/


eureka:
  instance:
    # OBLIGATORIO: Usa la IP numérica (192.168.x.x o 127.0.0.1) en vez del hostname
    prefer-ip-address: true 
    # Opcional: Para asegurar que sea localhost si estás desarrollando local
    # hostname: localhost 
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka