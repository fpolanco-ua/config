spring:
  apllication:
    name: task-service
  datasource:
    url: jdbc:mariadb://localhost:3306/tasks
    username: root
    password:
  jpa:
    generate-ddl: true
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update

server:
  port: 8083

#Eureka
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
